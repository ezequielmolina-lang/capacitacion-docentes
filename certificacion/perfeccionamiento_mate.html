<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso de Perfeccionamiento Docente — Matemáticas — Eligiendo Mi Camino</title>
<meta name="description" content="Curso asincrónico de perfeccionamiento para docentes de Matemáticas que implementan el Tutor de IA del programa Eligiendo Mi Camino. 8 horas pedagógicas. DRELM + Banco Mundial.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --primary:#f39300; --primary-dark:#f75a00; --primary-light:#fdd026;
    --bg-cream:#fffbf0; --bg:#fffbf0; --surface:#FFFFFF; --border:#f0e8d8;
    --text:#242c32; --text-dark:#242c32; --text-muted:#666;
    --math-bg:#FFEBEE; --math-color:#C62828;
    --success:#2E7D32; --error:#C62828; --info:#1565C0; --warning:#F57C00;
    --accent:#fdd026;
    --shadow-sm:0 1px 4px rgba(0,0,0,.05);
    --shadow:0 2px 12px rgba(0,0,0,.08);
    --shadow-lg:0 10px 30px rgba(243,147,0,.15), 0 4px 12px rgba(0,0,0,.08);
    --radius:12px;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{color:var(--text-dark);font-family:'Montserrat',sans-serif;font-weight:700}

  .app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:64px 1fr;grid-template-areas:"sidebar topbar" "sidebar main";min-height:100vh}
  .topbar{grid-area:topbar;background:var(--surface);border-bottom:2px solid var(--primary-light);display:flex;align-items:center;padding:0 32px;gap:16px;position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm)}
  .topbar-title{font-size:16px;font-weight:700;color:var(--text-dark)}
  .progress-wrap{flex:1;max-width:400px;margin:0 16px}
  .progress-text{font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:500}
  .progress-bar{height:8px;background:#f0e8d8;border-radius:4px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:4px;transition:width .4s ease}
  .topbar-meta{font-size:13px;color:var(--text-muted);display:flex;gap:16px}
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:8px;font-size:22px;color:var(--primary)}

  .sidebar{grid-area:sidebar;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;overflow-y:auto;position:sticky;top:0;height:100vh}
  .brand{padding:0 12px 20px;border-bottom:2px solid var(--primary-light);margin-bottom:16px}
  .brand-title{font-size:15px;font-weight:800;color:var(--primary);line-height:1.3}
  .brand-sub{font-size:12px;color:var(--text-muted);margin-top:4px;font-weight:500}
  .my-path{background:linear-gradient(135deg,#fffaeb 0%,#fff4d4 100%);border:2px solid var(--primary-light);border-radius:10px;padding:14px;margin:12px 0;font-size:12.5px}
  .my-path-label{font-size:10.5px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px}
  .my-path-name{font-weight:700;color:var(--text-dark);font-size:13.5px;line-height:1.3}
  .my-path-hours{margin-top:6px;font-weight:700;color:var(--primary-dark);font-size:14px}

  .nav-list{list-style:none;padding:0;margin:0}
  .nav-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:all .15s;font-size:13.5px;font-weight:500}
  .nav-item:hover{background:#fff8e1}
  .nav-item.active{background:linear-gradient(90deg,#fff4d4 0%,#fffaeb 100%);border-left:3px solid var(--primary);padding-left:9px}
  .nav-item.active .nav-title{color:var(--primary-dark);font-weight:700}
  .nav-num{width:26px;height:26px;border-radius:50%;background:#f0e8d8;color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .nav-item.completed .nav-num{background:var(--success);color:white}
  .nav-item.completed .nav-num::before{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;font-size:11px}
  .nav-item.completed .nav-num span{display:none}
  .nav-item.active .nav-num{background:var(--primary);color:white}
  .nav-item.active.completed .nav-num{background:var(--success)}
  .nav-content{flex:1;min-width:0}
  .nav-title{color:var(--text);line-height:1.3}
  .nav-meta{font-size:10.5px;color:var(--text-muted);margin-top:2px}

  .nav-section-title{font-size:10.5px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:18px 12px 8px}

  .main{grid-area:main;padding:40px 56px 80px;max-width:920px}
  .module-header{margin-bottom:32px}
  .module-eyebrow{color:var(--primary-light);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .module-title{font-size:32px;margin:0 0 8px;line-height:1.2}
  .module-meta{color:var(--text-muted);font-size:14px}

  .lesson{margin-bottom:28px}
  .lesson p{margin:0 0 16px;font-size:16px}
  .lesson h3{font-size:20px;margin:28px 0 12px}
  .lesson h4{font-size:17px;margin:20px 0 8px}
  .lesson ul,.lesson ol{padding-left:22px;margin:0 0 16px}
  .lesson li{margin-bottom:6px}
  .lesson strong{color:var(--primary)}

  .info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:20px 0;box-shadow:var(--shadow-sm)}
  .info-card h4{margin:0 0 12px;color:var(--text-dark)}

  .callout{border-radius:var(--radius);padding:16px 20px;margin:20px 0;border-left:4px solid}
  .callout-info{background:#E3F2FD;border-color:#1565C0}
  .callout-info strong{color:#1565C0}
  .callout-warning{background:#FFF8E1;border-color:var(--warning)}
  .callout-warning strong{color:#E65100}
  .callout-success{background:#E8F5E9;border-color:var(--success)}
  .callout-success strong{color:var(--success)}
  .callout-tip{background:#fff4d4;border-color:var(--primary)}
  .callout-tip strong{color:var(--primary-dark)}
  .callout p{margin:0;color:var(--text-dark)}
  .callout-icon{font-size:20px;margin-right:6px}

  table.data-table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
  table.data-table th{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:12px 14px;text-align:left;font-weight:700}
  table.data-table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top}
  table.data-table tr:last-child td{border-bottom:none}
  table.data-table tr:nth-child(even){background:#fffaeb}

  .moment-card{display:grid;grid-template-columns:80px 1fr;gap:18px;align-items:start;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .moment-num{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
  .moment-content h4{margin:0 0 6px;color:var(--text-dark);font-size:17px}
  .moment-content p{margin:0;font-size:14.5px;color:var(--text-muted)}
  .moment-content .moment-time{font-size:11.5px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px}

  .quiz{background:linear-gradient(135deg,#fffaeb 0%,#FFF 100%);border:2px solid var(--primary-light);border-radius:var(--radius);padding:28px;margin:32px 0 24px;box-shadow:var(--shadow-sm)}
  .quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .quiz-badge{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:5px 14px;border-radius:999px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .quiz h3{margin:0;font-size:19px}
  .quiz-question{font-size:16px;font-weight:600;margin:16px 0 14px;color:var(--text)}
  .quiz-options{display:grid;gap:10px;margin-bottom:16px}
  .quiz-option{background:white;border:2px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px;width:100%;font-family:inherit;color:var(--text);font-weight:500}
  .quiz-option:hover:not(:disabled){border-color:var(--primary);background:#fffaeb;transform:translateX(2px)}
  .quiz-option:disabled{cursor:default}
  .quiz-option .option-letter{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text-muted);flex-shrink:0;background:#fffaeb}
  .quiz-option.correct{border-color:var(--success);background:#E8F5E9}
  .quiz-option.correct .option-letter{background:var(--success);color:white;border-color:var(--success)}
  .quiz-option.incorrect{border-color:var(--error);background:var(--math-bg)}
  .quiz-option.incorrect .option-letter{background:var(--error);color:white;border-color:var(--error)}
  .quiz-feedback{padding:14px 16px;border-radius:10px;margin-top:12px;font-size:14.5px;display:none}
  .quiz-feedback.show{display:block}
  .quiz-feedback.correct{background:#E8F5E9;border-left:4px solid var(--success);color:#1B5E20}
  .quiz-feedback.incorrect{background:var(--math-bg);border-left:4px solid var(--error);color:#B71C1C}

  .btn{display:inline-block;padding:13px 28px;border-radius:999px;font-weight:700;cursor:pointer;border:none;font-size:14.5px;transition:all .2s;text-decoration:none;font-family:inherit;letter-spacing:.3px}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;box-shadow:0 4px 12px rgba(243,147,0,.25)}
  .btn-secondary{background:white;color:var(--primary-dark);border:2px solid var(--primary-light)}
  .btn-block{width:100%;padding:14px}

  .nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap}

  .quiz-progress{background:#f0e8d8;border-radius:4px;height:6px;overflow:hidden;margin:0 0 24px}
  .quiz-progress-fill{background:linear-gradient(90deg,var(--primary),var(--primary-dark));height:100%;transition:width .3s}

  .certificate{background:linear-gradient(135deg,#FFFEF5 0%,#FFF 100%);border:8px double var(--primary);padding:50px 32px;text-align:center;border-radius:var(--radius);margin:30px 0;box-shadow:var(--shadow-lg);position:relative}
  .certificate::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:6px;background:linear-gradient(90deg,var(--primary-light),var(--primary),var(--primary-dark));border-radius:var(--radius) var(--radius) 0 0}
  .cert-icon{font-size:54px;margin-bottom:14px;color:var(--primary)}
  .cert-title{font-size:30px;color:var(--primary-dark);margin:0 0 4px}
  .cert-subtitle{color:var(--text-muted);font-size:14px;font-weight:600}
  .cert-name{font-size:26px;font-weight:800;color:var(--text-dark);margin:26px 0 8px;font-family:'Montserrat',serif}
  .cert-body{font-size:15.5px;max-width:500px;margin:0 auto;line-height:1.7}
  .cert-seal{margin-top:26px;padding-top:18px;border-top:2px solid var(--primary-light);font-size:13px;color:var(--text-muted)}

  .welcome-overlay{position:fixed;inset:0;background:linear-gradient(135deg,rgba(243,147,0,.85) 0%,rgba(247,90,0,.9) 100%);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);padding:20px;overflow-y:auto}
  .welcome-modal{background:white;border-radius:var(--radius);padding:40px 36px;max-width:580px;width:100%;text-align:center;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;position:relative}
  .welcome-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--primary-light),var(--primary),var(--primary-dark));border-radius:var(--radius) var(--radius) 0 0}
  .welcome-modal h2{font-size:24px;margin:0 0 12px}
  .welcome-modal>p{font-size:15px;color:var(--text-muted);margin:0 0 22px}
  .welcome-modal .stat-row{display:flex;justify-content:center;gap:24px;margin:24px 0}
  .welcome-modal .stat-block{text-align:center}
  .welcome-modal .stat-block-num{font-size:28px;font-weight:800;color:var(--primary-dark)}
  .welcome-modal .stat-block-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600}
  .intake-input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:18px}
  .intake-input:focus{outline:none;border-color:var(--primary)}

  .welcome-hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;padding:36px 32px;border-radius:var(--radius);margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
  .welcome-hero::after{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(253,208,38,.2) 0%,transparent 70%);pointer-events:none}
  .welcome-hero h2{color:white;margin:0 0 10px;font-size:28px;font-weight:800;position:relative;z-index:1}
  .welcome-hero p{font-size:16px;opacity:.95;margin:0;font-weight:500;position:relative;z-index:1}
  .welcome-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;position:relative;z-index:1}
  .stat{background:rgba(255,255,255,.15);border-radius:10px;padding:12px;text-align:center;backdrop-filter:blur(4px)}
  .stat-num{font-size:24px;font-weight:800;color:var(--primary-light)}
  .stat-label{font-size:11.5px;opacity:.95;text-transform:uppercase;letter-spacing:.5px;font-weight:600}

  .reflection-area{width:100%;min-height:200px;padding:14px;border:2px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:15px;resize:vertical;margin-bottom:12px}
  .reflection-area:focus{outline:none;border-color:var(--primary)}

  /* New for Capacitación Continua */
  .video-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:var(--radius);overflow:hidden;background:#000;box-shadow:var(--shadow-lg);margin:20px 0}
  .video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}

  .feedback-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin:16px 0;box-shadow:var(--shadow-sm)}
  .feedback-block .feedback-momento{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .feedback-block .feedback-num{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
  .feedback-block .feedback-name{font-weight:700;color:var(--text-dark);font-size:16px}
  .feedback-block .feedback-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  @media (max-width:700px){.feedback-block .feedback-row{grid-template-columns:1fr}}
  .feedback-block .feedback-col-label{font-size:11.5px;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px}
  .feedback-block textarea{width:100%;min-height:80px;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;background:#fffdf6}
  .feedback-block textarea:focus{outline:none;border-color:var(--primary)}
  .feedback-saved{color:var(--success);font-size:13px;font-weight:600;margin-left:8px}

  .observations-card{background:linear-gradient(135deg,#fffaeb 0%,#FFF 100%);border:1px solid var(--primary-light);border-radius:var(--radius);padding:18px 22px;margin:12px 0;box-shadow:var(--shadow-sm)}
  .observations-card h4{margin:0 0 8px;color:var(--primary-dark);font-size:15px}
  .observations-card .obs-list{margin:0;padding-left:20px}
  .observations-card li{font-size:14.5px;margin-bottom:4px}
  .obs-positive{border-left:4px solid var(--success);background:linear-gradient(135deg,#E8F5E9 0%,#FFF 100%)}
  .obs-positive h4{color:#1B5E20}
  .obs-friction{border-left:4px solid var(--warning);background:linear-gradient(135deg,#FFF8E1 0%,#FFF 100%)}
  .obs-friction h4{color:#E65100}

  /* ============================================================
     Reporte demo (módulo 4) — visualmente idéntico al PDF real
     Scopeado bajo .report para no contaminar el resto del curso
  ============================================================ */
  .report{font-family:'Inter','Helvetica Neue',Arial,sans-serif;background:#faf4e3;color:#1a1815;padding:0;margin:24px 0;border-radius:6px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:13px;line-height:1.5;letter-spacing:0}
  .report-pg{background:#faf4e3;padding:38px 44px 28px;border-bottom:1px dashed #d9cfa8;position:relative;min-height:780px}
  .report-pg:last-child{border-bottom:none}
  .report-pg .pg-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #2a2417;margin-bottom:22px}
  .report-pg .pg-header-left{display:flex;gap:14px;align-items:flex-start}
  .report-pg .pg-logo{font-size:30px;line-height:1;margin-top:2px}
  .report-pg .pg-eyebrow{font-family:'Crimson Pro',serif;font-style:italic;font-size:13px;color:#c75d2e;margin:0 0 2px}
  .report-pg .pg-title{font-family:'Crimson Pro',serif;font-weight:700;font-size:26px;line-height:1.05;color:#1a1815;margin:0}
  .report-pg .pg-meta{text-align:right;font-size:11px;color:#1a1815;line-height:1.55}
  .report-pg .pg-meta .pg-meta-bold{font-weight:600;font-size:11.5px}
  .report-pg .pg-meta .pg-meta-line{color:#766c52}
  .report-pg .pg-footer{position:absolute;bottom:14px;left:44px;right:44px;display:flex;justify-content:space-between;font-size:10px;color:#9b9275;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid #e0d6b3;padding-top:8px}
  .report-pg .pg-footer-num{font-family:'JetBrains Mono',monospace;letter-spacing:.05em}

  .report .rp-section{margin-bottom:18px}
  .report .rp-section-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9b9275;letter-spacing:.05em;text-transform:uppercase;margin-right:8px}
  .report .rp-section-title{font-family:'Crimson Pro',serif;font-weight:700;font-size:18px;color:#1a1815;display:inline}
  .report .rp-section-title em{font-style:italic;font-weight:400;color:#c75d2e}
  .report .rp-section-rule{height:1px;background:#d9cfa8;margin:6px 0 14px}
  .report .rp-lead{font-size:13px;line-height:1.55;color:#1a1815;margin:0 0 10px}
  .report .rp-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;color:#c75d2e;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 4px}
  .report .rp-eyebrow-sub{font-style:italic;color:#766c52;font-family:'Crimson Pro',serif;font-size:12px;letter-spacing:0;text-transform:none}

  .report table.rp-table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:11.5px;background:transparent}
  .report table.rp-table th{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#9b9275;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:4px 8px 6px;font-weight:500;border-bottom:1px solid #d9cfa8}
  .report table.rp-table th.t-right,.report table.rp-table td.t-right{text-align:right;font-variant-numeric:tabular-nums}
  .report table.rp-table th.t-center,.report table.rp-table td.t-center{text-align:center}
  .report table.rp-table td{padding:5px 8px;border-bottom:1px solid #ece2c0;color:#1a1815;vertical-align:top}
  .report table.rp-table tr:last-child td{border-bottom:none}
  .report table.rp-table td.tu-seccion{background:#f0e6c3;font-weight:600;color:#c75d2e}
  .report table.rp-table td.warn{color:#c75d2e;font-weight:600}
  .report table.rp-table td.muted{color:#9b9275}

  .report .rp-bienvenida-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-bottom:24px}
  .report .rp-bienv-block{font-size:13px;line-height:1.55}
  .report .rp-bienv-block h3{font-family:'Crimson Pro',serif;font-weight:700;font-size:21px;margin:0 0 12px;color:#1a1815;line-height:1.15}
  .report .rp-bienv-block h3 em{font-style:italic;color:#c75d2e;font-weight:400}
  .report .rp-bienv-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#9b9275;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

</div>

<script>
const VIDEO_DRIVE_ID = '1vi49W906B84E-hFt9FwJmBpPtstK0WeX';

const MODULES = [
  {
    id: 'bienvenida-video',
    title: 'Bienvenida + Video del programa',
    eyebrow: 'Módulo 1 de 8',
    duration: '~15 min',
    content: () => `
      <div class="welcome-hero">
        <h2>Bienvenido al curso de perfeccionamiento</h2>
        <p>Matemáticas — Tutor de IA en el aula. Continuamos lo que empezó en marzo, ahora con los datos que ya tenemos de tu sección y tu sección comparada con el resto del programa.</p>
        <div class="welcome-stats">
          <div class="stat"><div class="stat-num">8 h</div><div class="stat-label">Pedagógicas</div></div>
          <div class="stat"><div class="stat-num">8</div><div class="stat-label">Módulos</div></div>
          <div class="stat"><div class="stat-num">30%</div><div class="stat-label">De tu nota final</div></div>
        </div>
      </div>

      <div class="lesson">
        <h3>Antes de empezar, mira este video (~10 min)</h3>
        <p>Es el resumen del programa: cómo nació Eligiendo Mi Camino, qué problema queremos resolver con el Tutor de IA, cómo encaja tu rol como docente de Matemáticas. <strong>Mira el video completo</strong>; es la mejor inducción al sentido del curso.</p>
        <div class="video-wrap">
          <iframe src="https://drive.google.com/file/d/${VIDEO_DRIVE_ID}/preview" allow="autoplay" allowfullscreen></iframe>
        </div>
        <p style="font-size:13.5px;color:var(--text-muted);">Si el video no carga, <a href="https://drive.google.com/file/d/${VIDEO_DRIVE_ID}/view" target="_blank" rel="noopener" style="color:var(--primary-dark);">abrílo directo en Google Drive</a>.</p>

        <h3>¿Qué vas a encontrar en este curso?</h3>
        <p>Este curso es <strong>diferente</strong> de la capacitación inicial de 16h que hiciste en marzo. Aquí no te enseñamos qué es el programa — eso ya lo sabes. Aquí te damos herramientas para los problemas reales que ya viviste estas primeras semanas:</p>
        <ol>
          <li><strong>Cómo leer el reporte de aula</strong> que recibes cada 2 semanas — página por página, con casos reales.</li>
          <li><strong>Cómo interpretar el dashboard</strong> en vivo durante una sesión sin distraerte del aula.</li>
          <li><strong>Qué hacer con los datos:</strong> guiones concretos para clases cortas de 10 minutos cuando ves un error conceptual repetido.</li>
          <li><strong>Cómo coordinar con tu director</strong> a partir del reporte que él/ella también recibe.</li>
          <li><strong>Cómo afinar los 5 momentos de tu sesión</strong> en función de lo que el dashboard te muestra.</li>
        </ol>

        <div class="callout callout-tip"><p><span class="callout-icon">💡</span><strong>Forma de trabajar:</strong> los módulos se hacen en orden, pero podés volver a los anteriores cuando quieras. El progreso queda guardado automáticamente. Al terminar el quiz final con 6/10 o más se emite tu certificado.</p></div>

        <div class="callout callout-info"><p><span class="callout-icon">📩</span><strong>¿Dudas sobre el curso o el reporte?</strong> Escribinos a <a href="mailto:eligiendomicamino@worldbank.org" style="color:#1565C0;font-weight:600;">eligiendomicamino@worldbank.org</a>.</p></div>
      </div>
    `,
    quiz: {
      question: '¿Cuál es la diferencia principal entre este curso y la capacitación inicial de 16 h que hiciste en marzo?',
      options: [
        'Es lo mismo, repetido para confirmar conocimientos',
        'Este es un examen con calificación; el anterior no tenía nota',
        'Este parte de los datos reales de tu sección para ajustar cómo enseñás con el Tutor IA en el aula',
        'Este es presencial y el anterior fue asincrónico'
      ],
      correct: 2,
      feedback: {
        correct: 'Exacto. Acá trabajamos sobre tus datos reales (reporte de aula, dashboard, casos que ya ves en tu sección), no sobre teoría general.',
        incorrect: 'Este curso parte de los datos reales de tu sección — el reporte que ya recibís cada quincena, el dashboard que viste en clase — para ajustar tu práctica. El curso inicial te dio el marco; este te da las herramientas operativas.'
      }
    }
  },

  {
    id: 'cinco-momentos',
    title: 'Los 5 momentos de la sesión',
    eyebrow: 'Módulo 2 de 8',
    duration: '~45 min',
    content: () => `
      <div class="lesson">
        <p>Toda sesión bien implementada con el Tutor de IA tiene la misma estructura básica. Estos <strong>5 momentos</strong> son el esqueleto operativo: si los respetás, no tenés que improvisar.</p>

        <div class="moment-card">
          <div class="moment-num">1</div>
          <div class="moment-content">
            <div class="moment-time">~5 min · Apertura</div>
            <h4>Bienvenida y conexión</h4>
            <p>Recibís a tus estudiantes y te aseguras de que <strong>todos accedan a uDocz</strong> con sus credenciales del programa. Igual de importante: <strong>tú también iniciás sesión con tu usuario docente</strong> — sin ese paso, esa clase no se registra como tuya y no cuenta para tu presencia.</p>
          </div>
        </div>

        <div class="moment-card">
          <div class="moment-num">2</div>
          <div class="moment-content">
            <div class="moment-time">~5 min · Encuadre</div>
            <h4>Objetivo y expectativa</h4>
            <p>Anunciás qué temática trabajarán y qué esperas que practiquen con el Tutor IA. <strong>Una frase corta</strong>: "Hoy seguimos con razones trigonométricas; vamos a llegar al menos al ejercicio 3". Esa expectativa explícita sube el volumen de práctica un 20-30% según lo que vimos en el programa.</p>
          </div>
        </div>

        <div class="moment-card">
          <div class="moment-num">3</div>
          <div class="moment-content">
            <div class="moment-time">~50 min · Práctica</div>
            <h4>Trabajo individual con monitoreo</h4>
            <p>Los estudiantes resuelven con la IA. Vos <strong>circulás con el dashboard abierto en una laptop o tablet</strong>. Buscás patrones (errores frecuentes, estudiantes que se trabaron) e intervenís <strong>solo cuando hace falta</strong>: si la IA ya está apoyando bien al estudiante, no interrumpas — la IA es muy buena en feedback inmediato 1 a 1.</p>
          </div>
        </div>

        <div class="moment-card">
          <div class="moment-num">4</div>
          <div class="moment-content">
            <div class="moment-time">~10 min · Intervención focalizada</div>
            <h4>Mini-clase puntual</h4>
            <p>Si el dashboard muestra un <strong>error conceptual repetido en 3+ estudiantes</strong> (ej.: confundir el signo en potencias con paréntesis), pausá la práctica individual y hacé una explicación rápida en pizarra para todos. Después regresan con la IA con esa idea fresca. <strong>El módulo 6 tiene 5 guiones concretos para esta mini-clase.</strong></p>
          </div>
        </div>

        <div class="moment-card">
          <div class="moment-num">5</div>
          <div class="moment-content">
            <div class="moment-time">~10 min · Cierre</div>
            <h4>Síntesis y próximos pasos</h4>
            <p>Recogés con la clase qué fue lo más difícil, validás con el dashboard a quién retomar la próxima sesión, y dejás tarea (con o sin plataforma). Cierra siempre con un mensaje breve sobre qué viene. Este cierre se conecta directo con lo que vas a leer en el reporte quincenal.</p>
          </div>
        </div>

        <div class="callout callout-tip"><p><span class="callout-icon">💡</span><strong>Regla de oro:</strong> el Tutor IA es muy bueno en práctica individual y feedback inmediato. Vos sos mejor en intervención conceptual y manejo del grupo. <strong>No compitas con la IA — complementala.</strong></p></div>

        <h3>Qué cambia entre la teoría y lo que pasa en tu aula</h3>
        <p>Cada docente adapta los 5 momentos. <strong>El módulo 3 es donde lo vas a contar</strong> — qué te funcionó, qué no funcionó, qué te gustaría mejorar. Esa información la usamos para ajustar el programa y para pensar en lo que viene.</p>
      </div>
    `,
    quiz: {
      question: 'En el momento 3 (práctica con monitoreo), ¿cuándo conviene intervenir directamente con un estudiante?',
      options: [
        'Cada vez que el estudiante haga una pregunta',
        'Solo cuando la IA no logre desbloquearlo después de varios intentos, o cuando veas un error conceptual repetido en varios estudiantes',
        'Nunca — el Tutor IA se encarga de todo',
        'Cada 10 minutos como protocolo fijo'
      ],
      correct: 1,
      feedback: {
        correct: 'Exacto. La intervención del docente tiene más valor cuando la IA ya intentó y no destrabó, o cuando hay un patrón colectivo que merece una mini-clase. Intervenir en todas las preguntas le quita espacio a la práctica individual.',
        incorrect: 'La intervención del docente debe ser <strong>focalizada</strong>: cuando la IA ya intentó (varios intentos con pistas) y no destrabó, o cuando ves un error conceptual repetido en varios. Intervenir en cada pregunta duplica trabajo y le quita espacio a la práctica con la IA.'
      }
    }
  },

  {
    id: 'feedback-momentos',
    title: 'Qué funcionó y qué no — contanos vos',
    eyebrow: 'Módulo 3 de 8',
    duration: '~30 min',
    content: () => `
      <div class="lesson">
        <p>Antes de seguir, queremos escucharte. Llevás algunas semanas implementando los 5 momentos. <strong>Tu experiencia importa</strong>: lo que aprendamos de vos ajusta el programa para todos.</p>

        <h3>Lo que vimos en aulas estas primeras semanas</h3>
        <p>Estas son observaciones cualitativas del equipo EMC visitando las IIEE entre el 30 de marzo y el 15 de mayo. No son tu sección en particular — son patrones que vimos repetirse.</p>

        <div class="observations-card obs-positive">
          <h4>✅ Lo que vimos funcionar</h4>

            <div class="wt-panel wt-panel-no"><h5>⚠️ Lo que NO significa</h5><p><strong>No es una evaluación de tu desempeño</strong>. Nadie más recibe estos datos sobre tu sección. La página lo dice explícitamente: "Lo que no es: una evaluación tuya".</p></div>
          </div>
          <div class="wt-mini-check"><div class="wt-mini-check-q">Mini-check:</div>Si tu semana está saturada y solo podés hacer una cosa de las dos sugeridas, ¿cuál priorizás según el reporte? <em>(Respuesta: las dos conversaciones de 2 min — son las de menor costo y mayor impacto inmediato sobre los estudiantes en riesgo.)</em></div>

            <div class="wt-panel wt-panel-muestra"><h5>🔎 ¿Qué muestra?</h5><p>Dos casos específicos con <strong>guion de conversación</strong>: por qué hablar con cada uno, cómo abrir la conversación, y tres respuestas posibles del estudiante con una acción concreta para cada una.</p></div>
            <div class="wt-panel wt-panel-lee"><h5>🧭 ¿Cómo se lee?</h5><p>Los dos estudiantes elegidos no son al azar: son los <strong>casos más urgentes</strong> de la sección. Uno por <em>cero acceso</em> (barrera de entrada) y uno por <em>alto esfuerzo bajo resultado</em> (riesgo de frustración).</p></div>
            <div class="wt-panel wt-panel-hago"><h5>🎯 ¿Qué hago con esto?</h5><p>Las conversaciones son <strong>cortas (2 min cada una)</strong> y se pueden hacer en cualquier momento — entrada al aula, recreo, después de una clase. No requieren preparar nada, el guion ya está armado.</p></div>
            <div class="wt-panel wt-panel-no"><h5>⚠️ Lo que NO significa</h5><p>Que esos dos sean tus únicos estudiantes en riesgo. Son los <strong>dos casos prioritarios para esta quincena</strong>. La página 6 muestra otros 9 estudiantes (priority 2 y 3) para la quincena siguiente.</p></div>
          </div>
          <div class="wt-mini-check"><div class="wt-mini-check-q">Mini-check:</div>¿Por qué el guion para María empieza con "¿Qué te pasó?" y no con "¿Por qué no entraste?"? <em>(Es menos juicio, más curiosidad. "Por qué" puede sonar a reclamo; "qué te pasó" abre la conversación sin defensa.)</em></div>
        </div>

        <div class="walkthrough">
          <div class="walkthrough-title"><span class="wt-pg-num">6</span>Estudiantes que necesitan atención · 3 prioridades + reconocimiento + cierre</div>
          <div class="wt-panels">
            <div class="wt-panel wt-panel-muestra"><h5>🔎 ¿Qué muestra?</h5><p><strong>Tres listas priorizadas:</strong> (1) los que no entraron, (2) los que entraron pero usaron poco, (3) los que usan bien pero acertando poco. Más un estudiante a reconocer + el cierre con dos preguntas para tu acompañante.</p></div>
            <div class="wt-panel wt-panel-lee"><h5>🧭 ¿Cómo se lee?</h5><p>El orden importa: <strong>primero los que no entraron</strong> (urgencia de acceso), <strong>después los que usaron poco</strong> (urgencia de adopción), <strong>después los de baja precisión</strong> (urgencia pedagógica, pero requieren más tiempo de tu parte).</p></div>
            <div class="wt-panel wt-panel-hago"><h5>🎯 ¿Qué hago con esto?</h5><p>Esta quincena: enfocarte en P1 y P2 (acceso + adopción). Próxima quincena: si ya entraron, recién entonces atender la baja precisión (P3). El <strong>reconocimiento</strong> a Karla son 30 segundos al final de una clase — no lo saltees.</p></div>
            <div class="wt-panel wt-panel-no"><h5>⚠️ Lo que NO significa</h5><p>Que los de P3 sean "menos importantes" — son los que más probablemente <strong>se frustren y abandonen</strong> si no se sienten vistos. Pero requieren más tiempo del docente. Por eso van en segunda etapa.</p></div>
          </div>
          <div class="wt-mini-check"><div class="wt-mini-check-q">Mini-check:</div>¿Por qué el reporte incluye explícitamente un estudiante para reconocer (Karla), incluso cuando hay otros 6 con buen rendimiento? <em>(Porque el reconocimiento dirigido a uno específico vale más que el reconocimiento genérico al grupo. Karla representa al grupo de alto rendimiento; mencionarla a ella envía la señal a todo ese grupo.)</em></div>
        </div>

        <div class="walkthrough">
          <div class="walkthrough-title"><span class="wt-pg-num">7-8</span>Anexo · todos tus estudiantes (continúa)</div>
          <div class="wt-panels">
            <div class="wt-panel wt-panel-muestra"><h5>🔎 ¿Qué muestra?</h5><p>La <strong>lista completa</strong> de todos los estudiantes de tu sección, con sus métricas: preguntas respondidas, minutos en plataforma, precisión, y tema más débil. Activos primero (de menor a mayor minuto), inactivos en gris al final.</p></div>
            <div class="wt-panel wt-panel-lee"><h5>🧭 ¿Cómo se lee?</h5><p>Es la <strong>referencia completa</strong> — útil cuando vas a hablar con un estudiante específico y querés ver su patrón. Los marcados en rojo son los que activan alarma (precisión baja, tiempo muy bajo).</p></div>
            <div class="wt-panel wt-panel-hago"><h5>🎯 ¿Qué hago con esto?</h5><p>Imprimíla y tenela en el aula durante la sesión de lab. Cuando un estudiante te pregunta algo, podés mirar su fila para entender el contexto. La <strong>columna "tema más débil"</strong> te dice por dónde abrir la conversación.</p></div>
            <div class="wt-panel wt-panel-no"><h5>⚠️ Lo que NO significa</h5><p>Que tengas que reaccionar a <strong>cada estudiante</strong> individualmente. El anexo es <em>referencia</em>, no lista de acciones. Las acciones priorizadas ya están en las páginas 4-5-6.</p></div>
          </div>
          <div class="wt-mini-check"><div class="wt-mini-check-q">Mini-check:</div>Un estudiante te pregunta en clase por qué siempre se equivoca en porcentajes. ¿Qué hacés con el anexo? <em>(Buscás su fila, mirás la columna "tema más débil". Si dice "Porcentajes", confirma el patrón. Si dice "Números reales", tal vez está confundiendo el malestar y el problema está en otro tema.)</em></div>
        </div>
      </div>
    `,
    quiz: {
      question: 'Recibís el reporte un lunes a las 8 am y tenés que dar clase a las 10 am. Solo tenés 14 minutos antes de la clase. ¿Qué priorizás?',
      options: [
        'Leer las 8 páginas completas y memorizarlas',
        'Saltarte el reporte y revisarlo el fin de semana',
        'Leer la página 1 (resumen), elegir si hacés la clase corta o las dos conversaciones, y arrancar',
        'Imprimir el reporte y entregárselo a tus estudiantes para que lo vean'
      ],
      correct: 2,
      feedback: {
        correct: 'Exacto. El reporte está diseñado para que la página 1 te dé lo esencial en menos de 5 minutos: una clase corta + dos conversaciones. Las páginas siguientes son el detalle de por qué y cómo, las leés cuando tengas tiempo.',
        incorrect: 'La página 1 es el resumen ejecutivo del reporte — está hecha para leerse en menos de 5 minutos y darte lo prioritario para la semana. El resto del reporte es detalle para cuando tengas tiempo. No es necesario memorizar todo ni entregárselo a los estudiantes (los datos son privados de tu sección).'
      }
    }
  },

  {
    id: 'reporte-director',
    title: 'El reporte del director',
    eyebrow: 'Módulo 5 de 8',
    duration: '~1 h',
    content: () => `
      <div class="lesson">
        <div class="coming-soon">
          <div class="coming-soon-icon">🏫</div>
          <h3>Módulo en construcción</h3>
          <p>Vamos a recorrer las <strong>5 páginas del reporte del director</strong> — para que entiendas qué ve tu director y cómo coordinar con él/ella alrededor del programa.</p>
        </div>
      </div>
    `,
    quiz: null
  },

  {
    id: 'errores-conceptuales',
    title: 'Errores conceptuales típicos + intervención',
    eyebrow: 'Módulo 6 de 8',
    duration: '~1.5 h',
    content: () => `
      <div class="lesson">
        <div class="coming-soon">
          <div class="coming-soon-icon">🎯</div>
          <h3>Módulo en construcción</h3>
          <p>5 errores frecuentes en 5to (signos en potencias, decimales, porcentajes, tasa nominal vs efectiva, notación científica) — cada uno con su <strong>guion de clase corta de 10 minutos</strong> listo para imprimir.</p>
        </div>
      </div>
    `,
    quiz: null
  },

  {
    id: 'casos-reales',
    title: 'Casos reales anonimizados',
    eyebrow: 'Módulo 7 de 8',
    duration: '~1 h',
    content: () => `
      <div class="lesson">
        <div class="coming-soon">
          <div class="coming-soon-icon">💼</div>
          <h3>Módulo en construcción</h3>
          <p>6 mini-casos reales (anonimizados) con diagnóstico y acción sugerida: estudiante con 0 actividad, alto volumen-baja precisión, sección con caída en una semana, etc.</p>
        </div>
      </div>
    `,
    quiz: null
  },

  {
    id: 'final',
    title: 'Quiz final y reflexión',
    eyebrow: 'Módulo 8 de 8',
    duration: '~30 min',
    isFinal: true,
    content: () => `
      <div class="lesson">
        <div class="coming-soon">
          <div class="coming-soon-icon">🎓</div>
          <h3>Módulo en construcción</h3>
          <p>Cuando los módulos 4-7 estén listos, acá vendrá el <strong>quiz final de 10 preguntas + reflexión</strong>. Al aprobar (≥6/10) se emite tu certificado descargable que acredita las 8h del componente "Productos y autoestudio" (30%).</p>
        </div>
      </div>
    `
  }
];

const FINAL_QUIZ = [
  {q:'(Placeholder) En el momento 3, ¿cuándo intervenís directamente?',o:['Siempre','Cuando la IA ya intentó y no destrabó','Nunca','Cada 10 min'],c:1},
  {q:'(Placeholder) ¿Cuál es tu rol respecto al Tutor IA?',o:['Reemplazarlo','Complementarlo','Replicarlo','Vigilarlo'],c:1}
];

const STORAGE_KEY = 'emc-perfeccionamiento-mate';
var state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return {
      currentModule: s.currentModule || 0,
      completed: s.completed || {},
      finalAnswers: s.finalAnswers || {},
      finalCompleted: s.finalCompleted || false,
      reflexion: s.reflexion || '',
      userName: s.userName || '',
      userDni: s.userDni || '',
      userSchool: s.userSchool || '',
      started: s.started || false,
      feedbackMomentos: s.feedbackMomentos || {},
      feedbackMomentosSubmitted: s.feedbackMomentosSubmitted || false
    };
  } catch(e) {
    return { currentModule:0, completed:{}, finalAnswers:{}, finalCompleted:false, reflexion:'', userName:'', userDni:'', userSchool:'', started:false, feedbackMomentos:{}, feedbackMomentosSubmitted:false };
  }
}

var TRACKING_URL = 'https://script.google.com/macros/s/AKfycbyUeu-Q_wesHnr9Df_OKWgfM6_o7pOMPP2Z5tlxATllORSfAYTDSYKcm-JsqJjS2Rd7/exec';
function trackProgress(moduleId, stepTitle) {
  if (!state.userName || !state.userDni) return;
  var data = {
    timestamp: new Date().toISOString(),
    name: state.userName,
    dni: state.userDni,
    school: state.userSchool || '',
    materia: 'mat',
    track: 'PERF-MATE',
    moduleId: moduleId,
    stepTitle: stepTitle || '',
    status: 'COMPLETED'
  };
  var params = Object.keys(data).map(function(k) { return k + '=' + encodeURIComponent(data[k]); }).join('&');
  try { fetch(TRACKING_URL + '?' + params, { mode: 'no-cors' }).catch(function(){}); } catch(e){}
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function saveFeedback(n) {
  if (!state.feedbackMomentos) state.feedbackMomentos = {};
  var pos = (document.getElementById('fb_pos_' + n) || {}).value || '';
  var neg = (document.getElementById('fb_neg_' + n) || {}).value || '';
  state.feedbackMomentos[n] = { pos: pos, neg: neg };
  saveState();
}

function submitFeedbackMomentos() {
  if (!state.feedbackMomentos) state.feedbackMomentos = {};
  for (var n = 1; n <= 5; n++) {
    var pos = (document.getElementById('fb_pos_' + n) || {}).value || '';
    var neg = (document.getElementById('fb_neg_' + n) || {}).value || '';
    state.feedbackMomentos[n] = { pos: pos, neg: neg };
    if (pos.trim() || neg.trim()) {
      trackProgress('FEEDBACK-MOM' + n, 'POS: ' + pos.replace(/\n/g,' ').slice(0,250) + ' | NEG: ' + neg.replace(/\n/g,' ').slice(0,250));
    }
  }
  state.feedbackMomentosSubmitted = true;
  state.completed['feedback-momentos'] = { answer: 0, correct: true };
  saveState();
  document.getElementById('feedbackSubmitMsg').style.display = '';
  document.getElementById('submitFeedbackBtn').disabled = true;
  document.getElementById('submitFeedbackBtn').textContent = '✅ Enviado';
  renderSidebar(); renderProgress();
}

function renderIntake() {
  const overlay = document.getElementById('welcomeOverlay');
  const modal = document.getElementById('welcomeModalContent');
  overlay.classList.remove('hidden');
  const ready = state.userName && state.userDni && state.userSchool;
  modal.innerHTML = `
    <div style="font-size:48px;margin-bottom:8px;">📐</div>
    <h2>Curso de perfeccionamiento docente</h2>
    <p>Matemáticas — Tutor de IA en el aula. <strong>8 horas pedagógicas asincrónicas</strong>. Tu progreso queda registrado para tu certificación.</p>
    <div class="stat-row">
      <div class="stat-block"><div class="stat-block-num">8</div><div class="stat-block-label">Módulos</div></div>
      <div class="stat-block"><div class="stat-block-num">~8 h</div><div class="stat-block-label">Pedagógicas</div></div>
      <div class="stat-block"><div class="stat-block-num">6/10</div><div class="stat-block-label">Quiz mínimo</div></div>
    </div>
    <input type="text" class="intake-input" id="userNameInput" placeholder="Nombre completo *" value="${state.userName||''}" oninput="onPersonalInput()">
    <input type="text" class="intake-input" id="userDniInput" placeholder="DNI *" value="${state.userDni||''}" maxlength="12" oninput="onPersonalInput()">
    <input type="text" class="intake-input" id="userSchoolInput" placeholder="Institución educativa *" value="${state.userSchool||''}" oninput="onPersonalInput()">
    <button class="btn btn-primary btn-block" id="startBtnIntake" ${!ready?'disabled':''} onclick="startCourse()">Empezar curso →</button>
  `;
}

function onPersonalInput() {
  const name = (document.getElementById('userNameInput')||{}).value || '';
  const dni = (document.getElementById('userDniInput')||{}).value || '';
  const school = (document.getElementById('userSchoolInput')||{}).value || '';
  const btn = document.getElementById('startBtnIntake');
  if (btn) btn.disabled = !(name.trim() && dni.trim() && school.trim());
}

function startCourse() {
  const name = document.getElementById('userNameInput').value.trim();
  const dni = document.getElementById('userDniInput').value.trim();
  const school = document.getElementById('userSchoolInput').value.trim();
  if (!name || !dni || !school) return;
  state.userName = name; state.userDni = dni; state.userSchool = school;
  state.started = true; state.currentModule = 0;
  saveState();
  trackProgress('ENROLLED', 'Inscripción al curso de perfeccionamiento Mate v2');
  document.getElementById('welcomeOverlay').classList.add('hidden');
  renderModule(); renderSidebar(); renderProgress();
}

function renderSidebar() {
  const list = document.getElementById('navList');
  list.innerHTML = '';
  MODULES.forEach((m, i) => {
    const li = document.createElement('li');
    li.className = 'nav-item';
    if (i === state.currentModule) li.classList.add('active');
    if (state.completed[m.id]) li.classList.add('completed');
    li.innerHTML = `
      <div class="nav-num"><span>${i + 1}</span></div>
      <div class="nav-content">
        <div class="nav-title">${m.title}</div>
        <div class="nav-meta">${m.duration}</div>
      </div>
    `;
    li.onclick = () => goToModule(i);
    list.appendChild(li);
  });
}

function renderProgress() {
  const total = MODULES.length;
  const done = MODULES.filter(m => state.completed[m.id]).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} de ${total} módulos completados (${pct}%)`;
}

function renderModule(opts) {
  opts = opts || {};
  const savedScroll = opts.preserveScroll ? window.scrollY : 0;
  const m = MODULES[state.currentModule];
  document.getElementById('topbarTitle').textContent = m.title;
  const main = document.getElementById('main');
  const contentHtml = typeof m.content === 'function' ? m.content() : m.content;
  let html = `
    <div class="module-header">
      <div class="module-eyebrow">${m.eyebrow} · ${m.duration}</div>
      <h1 class="module-title">${m.title}</h1>
    </div>
    ${contentHtml}
  `;
  if (!m.isFinal && m.quiz) {
    html += renderQuiz(m.id, m.quiz, state.completed[m.id]);
  }
  html += renderNavButtons();
  main.innerHTML = html;
  if (opts.preserveScroll) window.scrollTo(0, savedScroll); else window.scrollTo(0, 0);
  // Re-show feedback submit confirmation if already submitted
  if (m.id === 'feedback-momentos' && state.feedbackMomentosSubmitted) {
    var msg = document.getElementById('feedbackSubmitMsg');
    if (msg) msg.style.display = '';
    var btn = document.getElementById('submitFeedbackBtn');
    if (btn) { btn.disabled = true; btn.textContent = '✅ Enviado'; }
  }
  if (m.isFinal && state.finalCompleted) {
    const correct = countCorrect(state.finalAnswers, FINAL_QUIZ);
    if (correct >= 6 && state.reflexion) showCertificate(correct);
  }
}

function renderQuiz(moduleId, quiz, completed) {
  const savedAnswer = completed ? completed.answer : undefined;
  let optionsHtml = quiz.options.map((opt, i) => {
    let cls = 'quiz-option';
    let disabled = '';
    if (savedAnswer !== undefined) {
      disabled = 'disabled';
      if (i === quiz.correct) cls += ' correct';
      else if (i === savedAnswer) cls += ' incorrect';
    }
    return `<button class="${cls}" ${disabled} onclick="answerQuiz('${moduleId}', ${i}, ${quiz.correct})"><div class="option-letter">${String.fromCharCode(65 + i)}</div><span>${opt}</span></button>`;
  }).join('');
  let feedbackHtml = '';
  if (savedAnswer !== undefined) {
    const isCorrect = savedAnswer === quiz.correct;
    feedbackHtml = `<div class="quiz-feedback ${isCorrect ? 'correct' : 'incorrect'} show"><strong>${isCorrect ? '✅ ¡Correcto!' : '❌ No es la respuesta correcta.'}</strong><br>${isCorrect ? quiz.feedback.correct : quiz.feedback.incorrect}</div>`;
  }
  return `
    <div class="quiz">
      <div class="quiz-header"><span class="quiz-badge">Comprueba tu comprensión</span></div>
      <div class="quiz-question">${quiz.question}</div>
      <div class="quiz-options">${optionsHtml}</div>
      ${feedbackHtml}
    </div>
  `;
}

function renderNavButtons() {
  const isLast = state.currentModule === MODULES.length - 1;
  const isFirst = state.currentModule === 0;
  const m = MODULES[state.currentModule];
  const completed = state.completed[m.id];
  // For coming-soon modules (no quiz, not final), allow advancing
  const isComingSoon = !m.quiz && !m.isFinal;
  const canAdvance = m.isFinal ? (state.finalCompleted && state.reflexion) : (completed || isComingSoon);
  // Auto-mark coming-soon modules as visited (not completed for progress, just so they don't block)
  return `
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="prevModule()" ${isFirst ? 'disabled' : ''}>← Anterior</button>
      ${!isLast ? `<button class="btn btn-primary" onclick="nextModule()" ${!canAdvance ? 'disabled' : ''}>${canAdvance ? 'Siguiente módulo →' : (isComingSoon ? 'En construcción' : 'Responde para continuar')}</button>` : `<span style="color:var(--text-muted); font-size:14px;">${canAdvance ? '🎉 ¡Curso completado!' : 'Curso aún en construcción — los últimos módulos llegarán pronto.'}</span>`}
    </div>
  `;
}

function answerQuiz(moduleId, answerIdx, correctIdx) {
  if (state.completed[moduleId]) return;
  state.completed[moduleId] = { answer: answerIdx, correct: answerIdx === correctIdx };
  saveState();
  var m = MODULES.find(function(x){ return x.id === moduleId; });
  trackProgress('MOD-' + moduleId, m ? m.title : moduleId);
  renderModule({preserveScroll: true});
  renderSidebar(); renderProgress();
  setTimeout(function() {
    var fb = document.querySelector('.quiz-feedback.show');
    if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

function nextModule() { if (state.currentModule < MODULES.length - 1) { state.currentModule++; saveState(); renderModule(); renderSidebar(); renderProgress(); closeSidebarMobile(); } }
function prevModule() { if (state.currentModule > 0) { state.currentModule--; saveState(); renderModule(); renderSidebar(); renderProgress(); closeSidebarMobile(); } }
function goToModule(i) { state.currentModule = i; saveState(); renderModule(); renderSidebar(); renderProgress(); closeSidebarMobile(); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebarMobile() { if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open'); }

function countCorrect(answers, quiz) { let c = 0; quiz.forEach((q, i) => { if (answers[i] === q.c) c++; }); return c; }

function showCertificate(correct) {
  // Placeholder until Fase D
  const total = FINAL_QUIZ.length;
  const name = state.userName || 'Docente Participante';
  const today = new Date().toLocaleDateString('es-PE', { day: 'numeric', month: 'long', year: 'numeric' });
  const main = document.getElementById('main');
  main.innerHTML += `
    <div class="certificate">
      <div class="cert-icon">🎓</div>
      <h2 class="cert-title">Curso de Perfeccionamiento Docente</h2>
      <div class="cert-subtitle">Matemáticas — Tutor de IA · 8 horas pedagógicas</div>
      <div class="cert-name">${name}</div>
      <div class="cert-body">Ha completado satisfactoriamente el <strong>curso de perfeccionamiento docente</strong> del programa <strong>Eligiendo Mi Camino</strong>.</div>
      <div class="cert-seal">Resultado del quiz final: <strong>${correct}/${total}</strong> &nbsp;·&nbsp; ${today}<br>DRELM · Banco Mundial · uDocz · UPC</div>
    </div>
  `;
}

function init() {
  if (window.location.search.indexOf('reset') !== -1) {
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    history.replaceState({}, '', window.location.pathname);
  }
  if (state.started) {
    document.getElementById('welcomeOverlay').classList.add('hidden');
    renderModule(); renderSidebar(); renderProgress();
  } else {
    renderIntake();
  }
}
init();
</script>
</body>
</html>
