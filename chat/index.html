<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f39300" />
  <title>Eligiendo Mi Camino — el gallito</title>
  <meta name="description" content="Conversa con el gallito de Eligiendo Mi Camino: qué es el programa, cómo funciona y cómo replicarlo. / Chat with the gallito of Eligiendo Mi Camino." />
  <link rel="icon" href="gallito.png" />
  <link rel="apple-touch-icon" href="gallito.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #f39300;
      --primary-dark: #f75a00;
      --primary-light: #fdd026;
      --bg-cream: #fffbf0;
      --bg-cream-2: #fff5e0;
      --text-dark: #242c32;
      --text-gray: #6a6a6a;
      --math-color: #C62828;
      --ov-color: #2E7D32;
      --pip-color: #1565C0;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
      --card-shadow-strong: 0 6px 24px rgba(0,0,0,0.12);
      --radius: 14px;
      --radius-sm: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* Views — one visible at a time */
    .view { display: none; flex: 1; }
    .view.active { display: flex; flex-direction: column; animation: fadeUp 0.4s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ============ Floating language toggle ============ */
    .lang-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 50;
      display: flex; gap: 2px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(36,44,50,0.1);
      border-radius: 100px; padding: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .lang-opt {
      border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.5px; color: var(--text-gray);
      padding: 5px 11px; border-radius: 100px; transition: all 0.18s;
    }
    .lang-opt.active { background: var(--primary); color: #fff; }

    /* ============ Welcome view ============ */
    #view-welcome { align-items: center; justify-content: center; padding: 48px 24px; text-align: center; }
    .welcome-card { max-width: 560px; width: 100%; }
    .gallito-hero-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 22px; isolation: isolate; }
    .gallito-hero-wrap::before {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(243,147,0,0.55), rgba(247,90,0,0.30), rgba(253,208,38,0.45), rgba(243,147,0,0.55));
      filter: blur(16px); opacity: 0.55; animation: spin 9s linear infinite; z-index: 0;
    }
    /* Cream disc directly behind the video so its white background multiplies into cream */
    .gallito-hero-wrap::after {
      content: ''; position: absolute; z-index: 1;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 216px; height: 216px; border-radius: 50%;
      background: var(--bg-cream);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gallito-hero {
      position: relative; z-index: 2; width: 200px; height: 200px; margin: 10px auto 0;
      display: block; border-radius: 50%; object-fit: cover; background: var(--bg-cream);
      mix-blend-mode: multiply;
      animation: bobble 4s ease-in-out infinite;
      /* brightness+contrast clamp the video's cool near-white compression noise up to pure
         white, so multiply maps it to exact page cream and no faint box shows */
      filter: brightness(1.05) contrast(1.12) drop-shadow(0 8px 24px rgba(243,147,0,0.22));
    }
    @keyframes bobble { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .welcome-title {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: 2.5rem; line-height: 1.05; color: var(--text-dark); letter-spacing: -0.5px;
    }
    .welcome-sub {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 1.2rem; color: var(--text-gray); margin: 14px auto 0; max-width: 30em;
    }
    .entry-chips {
      display: grid; grid-template-columns: 1fr; gap: 10px;
      max-width: 540px; margin: 28px auto 0;
    }
    @media (min-width: 620px) { .entry-chips { grid-template-columns: 1fr 1fr; } }
    .suggested {
      background: #fff; border: 1.5px solid rgba(36,44,50,0.10); border-radius: var(--radius-sm);
      padding: 13px 15px; font-family: inherit; font-size: 0.9rem; text-align: left;
      cursor: pointer; color: var(--text-dark); line-height: 1.35;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), border-color 0.15s, box-shadow 0.18s, background 0.15s;
    }
    .suggested:hover { border-color: var(--primary); background: #fff8e7; transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 22px rgba(243,147,0,0.14); }
    .suggested:active { transform: translateY(0) scale(0.98); }
    .welcome-cta { margin-top: 26px; }
    .btn-playbook {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
      border: none; border-radius: 100px; padding: 12px 24px;
      font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
      text-decoration: none; box-shadow: 0 4px 16px rgba(243,147,0,0.32);
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
    }
    .btn-playbook:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 22px rgba(243,147,0,0.42); }
    .btn-playbook svg { width: 16px; height: 16px; }
    .welcome-partners {
      margin-top: 30px; font-size: 0.72rem; letter-spacing: 0.4px; color: var(--text-gray);
      line-height: 1.6; max-width: 36em; margin-left: auto; margin-right: auto;
    }

    /* ============ Chat view ============ */
    #view-chat.active { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }
    .chat-app {
      max-width: 760px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
      background: var(--bg-cream);
    }
    .chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 92px 14px 14px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-bottom: 1px solid rgba(36,44,50,0.08);
      position: sticky; top: 0; z-index: 10;
    }
    .chat-back {
      background: none; border: none; color: var(--primary-dark); cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }
    .chat-back:hover { background: rgba(243,147,0,0.1); }
    .chat-back svg { width: 22px; height: 22px; }
    .chat-header-gallito { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name {
      font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.1rem;
      color: var(--text-dark); line-height: 1.15;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-header-meta {
      font-size: 0.78rem; color: var(--text-gray); margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .chat-body {
      flex: 1; overflow-y: auto; padding: 20px 18px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .msg-row { display: flex; gap: 10px; animation: msg-enter 0.34s cubic-bezier(0.34,1.56,0.64,1) both; }
    .msg-row.user { justify-content: flex-end; }
    @keyframes msg-enter { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .msg-bubble {
      max-width: min(78%, 540px); padding: 11px 16px; border-radius: 18px;
      font-size: 0.97rem; line-height: 1.5; word-wrap: break-word;
    }
    .msg-bubble.user {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
      border-bottom-right-radius: 4px; box-shadow: 0 4px 16px rgba(243,147,0,0.22);
      white-space: pre-wrap;
    }
    .msg-bubble.gallito {
      background: transparent; color: var(--text-dark); border: none; box-shadow: none;
      border-radius: 0; padding: 4px 0 4px 2px; max-width: calc(100% - 50px);
      font-size: 1rem; line-height: 1.55;
    }
    .msg-bubble.gallito strong { color: var(--primary-dark); }
    .msg-bubble.gallito a { color: var(--primary-dark); text-decoration: underline; text-underline-offset: 2px; }
    .msg-bubble.gallito p { margin: 0; }
    .msg-bubble.gallito p + p { margin-top: 0.6em; }
    .msg-bubble.gallito ul, .msg-bubble.gallito ol { margin: 0.4em 0 0.4em 1.3em; padding: 0; }
    .msg-bubble.gallito li { margin: 2px 0; }
    .msg-bubble.error { background: transparent; color: var(--math-color); border: none; padding: 4px 0 4px 2px; }

    .gallito-avatar {
      width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; margin-top: 2px; align-self: flex-start;
      transition: filter 0.25s, transform 0.25s;
    }
    .msg-row.streaming .gallito-avatar {
      animation: avatar-pulse 1.4s ease-in-out infinite;
      filter: drop-shadow(0 0 10px rgba(243,147,0,0.55));
    }
    @keyframes avatar-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: typing 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    /* Inline video cards */
    .video-cards { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 0 42px; }
    .video-card {
      display: flex; gap: 12px; align-items: center; max-width: min(88%, 460px);
      background: #fff; border: 1px solid rgba(36,44,50,0.12); border-radius: var(--radius-sm);
      padding: 10px; text-decoration: none; color: var(--text-dark);
      box-shadow: var(--card-shadow); transition: transform 0.18s, box-shadow 0.18s;
    }
    .video-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-strong); }
    .video-thumb-wrap { position: relative; flex-shrink: 0; width: 120px; height: 68px; }
    .video-thumb { width: 120px; height: 68px; border-radius: 8px; object-fit: cover; background: var(--bg-cream-2); display: block; }
    .video-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .video-play svg { width: 34px; height: 34px; }
    .video-meta { min-width: 0; }
    .video-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.02rem; line-height: 1.2; }
    .video-sub { font-size: 0.75rem; color: var(--text-gray); margin-top: 5px; display: flex; align-items: center; gap: 6px; }
    .video-badge {
      display: inline-block; background: var(--bg-cream-2); color: var(--primary-dark);
      border-radius: 100px; padding: 2px 8px; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.5px;
    }

    /* Follow-up chips */
    .followups { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 42px; max-width: min(90%, 560px); }
    .followup-chip {
      background: #fff; border: 1px solid rgba(243,147,0,0.35); color: var(--primary-dark);
      border-radius: 100px; padding: 6px 12px; font-family: inherit; font-size: 0.78rem;
      cursor: pointer; line-height: 1.2; text-align: left; max-width: 100%;
      animation: chip-enter 0.32s cubic-bezier(0.34,1.56,0.64,1) both;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s;
    }
    .followup-chip:nth-child(1) { animation-delay: 0.05s; }
    .followup-chip:nth-child(2) { animation-delay: 0.12s; }
    .followup-chip:nth-child(3) { animation-delay: 0.19s; }
    @keyframes chip-enter { from { opacity: 0; transform: translateY(6px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .followup-chip:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 16px rgba(243,147,0,0.30); }
    .followup-chip:active { transform: scale(0.95); }

    /* Input zone */
    .chat-input-zone { border-top: 1px solid rgba(36,44,50,0.08); background: var(--bg-cream); padding: 12px 14px 14px; }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; max-width: 720px; margin: 0 auto; position: relative; }
    .chat-input {
      flex: 1; font-family: inherit; font-size: 1rem; padding: 12px 14px;
      border: 2px solid rgba(36,44,50,0.12); border-radius: 20px; background: #fff;
      resize: none; max-height: 140px; line-height: 1.4;
    }
    .chat-input:focus { outline: none; border-color: var(--primary); }
    .chat-mic {
      background: #fff; color: var(--primary-dark); border: 1.5px solid rgba(243,147,0,0.35);
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), background 0.18s, color 0.18s, border-color 0.18s;
    }
    .chat-mic:hover { transform: scale(1.06); background: #fff8e7; }
    .chat-mic:active { transform: scale(0.95); }
    .chat-mic svg { width: 20px; height: 20px; }
    .chat-mic.recording { background: var(--math-color); border-color: var(--math-color); color: #fff; animation: mic-pulse 1.1s ease-in-out infinite; }
    @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(198,40,40,0.5); } 50% { box-shadow: 0 0 0 8px rgba(198,40,40,0); } }
    .chat-send {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none;
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(243,147,0,0.32);
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
    }
    .chat-send:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 6px 16px rgba(243,147,0,0.45); }
    .chat-send:active:not(:disabled) { transform: scale(0.95); }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-send svg { width: 18px; height: 18px; }

    .mic-hint {
      position: absolute; bottom: 54px; right: 50px; background: var(--text-dark); color: #fff;
      font-size: 0.78rem; padding: 8px 12px; border-radius: 10px; max-width: 210px; text-align: left;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25); opacity: 0; pointer-events: none;
      transform: translateY(6px); transition: opacity 0.25s, transform 0.25s; z-index: 20;
    }
    .mic-hint.show { opacity: 1; transform: translateY(0); }
    .mic-hint::after { content: ''; position: absolute; bottom: -6px; right: 22px; border: 6px solid transparent; border-top-color: var(--text-dark); border-bottom: 0; }

    /* Mic permission help modal */
    .mic-help-backdrop {
      position: fixed; inset: 0; background: rgba(36,44,50,0.55); backdrop-filter: blur(4px);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px;
      animation: fade-in 0.2s ease both;
    }
    .mic-help-backdrop.open { display: flex; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .mic-help-card {
      background: #fff; border-radius: var(--radius); max-width: 460px; width: 100%;
      padding: 22px 22px 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); max-height: 85vh; overflow-y: auto;
      animation: pop-in 0.28s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes pop-in { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .mic-help-icon { font-size: 2.2rem; text-align: center; margin-bottom: 6px; }
    .mic-help-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.4rem; text-align: center; margin-bottom: 6px; color: var(--text-dark); }
    .mic-help-intro { text-align: center; font-size: 0.9rem; color: var(--text-gray); margin-bottom: 14px; }
    .mic-help-tab-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
    .mic-help-tab { background: #fff; border: 1px solid rgba(36,44,50,0.15); color: var(--text-gray); border-radius: 100px; padding: 6px 14px; font-family: inherit; font-size: 0.78rem; cursor: pointer; font-weight: 500; }
    .mic-help-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .mic-help-steps { background: var(--bg-cream); border-radius: var(--radius-sm); padding: 12px 14px; margin: 6px 0 16px; font-size: 0.92rem; line-height: 1.55; color: var(--text-dark); }
    .mic-help-steps ol { margin: 0 0 0 1.2em; padding: 0; }
    .mic-help-steps li { margin: 4px 0; }
    .mic-help-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .mic-help-close {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none;
      border-radius: 100px; padding: 10px 20px; font-family: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
    }

    @media (max-width: 600px) {
      .welcome-title { font-size: 2rem; }
      .welcome-sub { font-size: 1.05rem; }
      .chat-body { padding: 16px 14px; }
      .video-cards, .followups { margin-left: 0; }
      .gallito-hero-wrap { width: 180px; height: 180px; }
      .gallito-hero { width: 164px; height: 164px; }
      .gallito-hero-wrap::after { width: 178px; height: 178px; }
    }
  </style>
</head>
<body>
  <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
    <button class="lang-opt" data-lang="es">ES</button>
    <button class="lang-opt" data-lang="en">EN</button>
  </div>

  <div class="app">
    <!-- ============ Welcome ============ -->
    <section class="view active" id="view-welcome">
      <div class="welcome-card">
        <div class="gallito-hero-wrap">
          <video class="gallito-hero" autoplay loop muted playsinline poster="gallito.png" aria-hidden="true">
            <source src="gallito.mp4" type="video/mp4" />
          </video>
        </div>
        <h1 class="welcome-title" id="hero-title"></h1>
        <p class="welcome-sub" id="hero-sub"></p>
        <div class="entry-chips" id="entry-chips"></div>
        <div class="welcome-cta">
          <a class="btn-playbook" id="btn-playbook" href="https://ezequielmolina-lang.github.io/emc-steal-shamelessly-hub/" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <p class="welcome-partners" id="welcome-partners"></p>
      </div>
    </section>

    <!-- ============ Chat ============ -->
    <section class="view" id="view-chat">
      <div class="chat-app">
        <header class="chat-header">
          <button class="chat-back" id="btn-new" aria-label="Nueva conversación">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <img class="chat-header-gallito" src="gallito.png" alt="" />
          <div class="chat-header-info">
            <div class="chat-header-name">el gallito</div>
            <div class="chat-header-meta">Eligiendo Mi Camino</div>
          </div>
        </header>

        <div class="chat-body" id="chat-body"></div>

        <div class="chat-input-zone">
          <div class="chat-input-row">
            <div class="mic-hint" id="mic-hint"></div>
            <textarea class="chat-input" id="chat-input" rows="1" placeholder="" autocomplete="off"></textarea>
            <button class="chat-mic" id="btn-mic" aria-label="Mic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
            </button>
            <button class="chat-send" id="btn-send" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Mic help modal -->
  <div class="mic-help-backdrop" id="mic-help-backdrop" role="dialog" aria-modal="true" aria-labelledby="mic-help-title">
    <div class="mic-help-card">
      <div class="mic-help-icon">🎤</div>
      <div class="mic-help-title" id="mic-help-title"></div>
      <p class="mic-help-intro" id="mic-help-intro"></p>
      <div class="mic-help-tab-row" id="mic-help-tabs"></div>
      <div class="mic-help-steps" id="mic-help-steps"></div>
      <div class="mic-help-actions">
        <button class="mic-help-close" id="mic-help-close"></button>
      </div>
    </div>
  </div>

  <script>
'use strict';
(function () {
  const params = new URLSearchParams(location.search);
  const API_BASE = (params.get('api') || 'https://emc-explorar-api.vercel.app').replace(/\/+$/, '');
  const HUB_URL = 'https://ezequielmolina-lang.github.io/emc-steal-shamelessly-hub/';

  const I18N = {
    es: {
      doc_title: 'Eligiendo Mi Camino — el gallito',
      hero_title: 'Conversa con el gallito',
      hero_sub: 'Soy el embajador público de Eligiendo Mi Camino. Pregúntame qué es el programa, cómo funciona y cómo replicarlo en tu país.',
      chips: [
        '¿Qué es Eligiendo Mi Camino?',
        '¿Cómo lo replicamos en mi país?',
        'Muéstrame los videos demo',
        '¿Qué dice la evidencia?',
        '¿Cómo funciona el tutor de matemáticas?'
      ],
      placeholder: 'Escríbeme tu pregunta...',
      new_chat: 'Nueva conversación',
      playbook: 'Llévate el playbook',
      partners: 'Banco Mundial · DRELM · UPC · uDocz · Anthropic — Ganador del Premio a la Innovación del Banco Mundial 2026',
      err: 'Ups — algo falló de mi lado. Intenta de nuevo en un momento.',
      err_offline: 'No pude conectarme. Revisa tu conexión e inténtalo de nuevo.',
      err_notready: 'El gallito todavía se está terminando de configurar. Vuelve a intentarlo en un momento.',
      mic_hint: 'Puedes hablarme — toca el micrófono.',
      mic_title: 'Activa el micrófono',
      mic_intro: 'Para hablarme, tu navegador necesita permiso para usar el micrófono.',
      mic_tabs: { android: 'Android / Chrome', ios: 'iPhone / Safari' },
      mic_steps: {
        android: ['Toca el candado o el ícono ⓘ junto a la dirección web.', 'Activa el permiso de Micrófono.', 'Recarga la página y vuelve a tocar el micrófono.'],
        ios: ['Abre Ajustes → Safari → Micrófono.', 'Permite el acceso para este sitio.', 'Vuelve aquí y toca el micrófono otra vez.']
      },
      mic_close: 'Entendido'
    },
    en: {
      doc_title: 'Eligiendo Mi Camino — the gallito',
      hero_title: 'Chat with the gallito',
      hero_sub: "I'm the public ambassador of Eligiendo Mi Camino. Ask me what the programme is, how it works, and how to replicate it in your country.",
      chips: [
        'What is Eligiendo Mi Camino?',
        'Can we replicate this in my country?',
        'Show me the demo videos',
        'What does the evidence say?',
        'How does the math tutor work?'
      ],
      placeholder: 'Type your question...',
      new_chat: 'New conversation',
      playbook: 'Get the playbook',
      partners: 'World Bank · DRELM · UPC · uDocz · Anthropic — Winner of the World Bank Innovation Award 2026',
      err: 'Oops — something broke on my end. Please try again in a moment.',
      err_offline: "I couldn't connect. Check your connection and try again.",
      err_notready: 'The gallito is still finishing its setup. Please try again in a moment.',
      mic_hint: 'You can talk to me — tap the mic.',
      mic_title: 'Turn on the microphone',
      mic_intro: 'To talk to me, your browser needs permission to use the microphone.',
      mic_tabs: { android: 'Android / Chrome', ios: 'iPhone / Safari' },
      mic_steps: {
        android: ['Tap the lock or ⓘ icon next to the web address.', 'Turn on the Microphone permission.', 'Reload the page and tap the mic again.'],
        ios: ['Open Settings → Safari → Microphone.', 'Allow access for this site.', 'Come back here and tap the mic again.']
      },
      mic_close: 'Got it'
    }
  };

  const PLAY_SVG = '<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" fill="rgba(36,44,50,0.55)"/><path d="M20 16l12 8-12 8z" fill="#fff"/></svg>';
  const TYPING_HTML = '<span class="typing"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span>';

  const qs = (s) => document.querySelector(s);
  const bodyEl = () => qs('#chat-body');

  let initialLang = localStorage.getItem('emc-explorar-lang');
  const urlLang = params.get('lang');
  if (urlLang === 'es' || urlLang === 'en') initialLang = urlLang;
  const state = { messages: [], lang: (initialLang === 'en' ? 'en' : 'es'), busy: false };

  let micHelpTab = 'android';

  /* ---------- rendering helpers ---------- */
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMarkdown(text) {
    const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let html = esc
      .replace(/\[([^\]\n]+)\]\((https?:[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(?<![*\w])\*([^*\n]+)\*(?!\w)/g, '<em>$1</em>');
    html = html.split(/\n{2,}/).map((p) => {
      if (/^\s*[-•]\s+/.test(p)) {
        const items = p.split(/\n/).map((l) => l.replace(/^\s*[-•]\s+/, '').trim()).filter(Boolean);
        return '<ul>' + items.map((i) => `<li>${i}</li>`).join('') + '</ul>';
      }
      if (/^\s*\d+\.\s+/.test(p)) {
        const items = p.split(/\n/).map((l) => l.replace(/^\s*\d+\.\s+/, '').trim()).filter(Boolean);
        return '<ol>' + items.map((i) => `<li>${i}</li>`).join('') + '</ol>';
      }
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('');
    return html;
  }

  function splitSuggestions(text) {
    const m = text.match(/\n*\[SUGGESTIONS\]\s*:\s*([^\n]+)\s*$/i);
    if (!m) return { body: text, suggestions: [] };
    const body = text.slice(0, m.index).replace(/\s+$/, '');
    const suggestions = m[1].split('|').map((s) => s.trim()).filter(Boolean).slice(0, 3);
    return { body, suggestions };
  }

  // During streaming, hide the suggestions marker the moment it starts appearing.
  function liveBody(text) {
    const i = text.indexOf('[SUG');
    return i === -1 ? text : text.slice(0, i).replace(/\s+$/, '');
  }

  function scrollToBottom() {
    const el = bodyEl();
    el.scrollTop = el.scrollHeight;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }

  /* ---------- message DOM ---------- */
  function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const b = document.createElement('div');
    b.className = 'msg-bubble user';
    b.textContent = text;
    row.appendChild(b);
    bodyEl().appendChild(row);
    scrollToBottom();
  }

  function addGallitoRow() {
    const row = document.createElement('div');
    row.className = 'msg-row gallito streaming';
    const av = document.createElement('img');
    av.className = 'gallito-avatar'; av.src = 'gallito.png'; av.alt = '';
    const b = document.createElement('div');
    b.className = 'msg-bubble gallito';
    b.innerHTML = TYPING_HTML;
    row.appendChild(av); row.appendChild(b);
    bodyEl().appendChild(row);
    scrollToBottom();
    return { row, bubble: b };
  }

  function clearFollowups() {
    const e = qs('#active-followups');
    if (e) e.remove();
  }

  function renderFollowups(list) {
    clearFollowups();
    if (!list || !list.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'followups';
    wrap.id = 'active-followups';
    list.slice(0, 3).forEach((s) => {
      const b = document.createElement('button');
      b.className = 'followup-chip';
      b.textContent = s;
      b.addEventListener('click', () => sendMessage(s));
      wrap.appendChild(b);
    });
    bodyEl().appendChild(wrap);
    scrollToBottom();
  }

  /* ---------- video cards ---------- */
  let VIDEO_MAP = null;
  async function loadVideos() {
    if (VIDEO_MAP) return VIDEO_MAP;
    try {
      const r = await fetch(API_BASE + '/api/videos');
      if (!r.ok) throw new Error('bad');
      const j = await r.json();
      VIDEO_MAP = {};
      (j.videos || []).forEach((v) => { if (v.drive_id) VIDEO_MAP[v.drive_id] = v; });
    } catch (e) {
      VIDEO_MAP = {};
    }
    return VIDEO_MAP;
  }

  function pickLang(obj) {
    if (!obj) return '';
    return obj[state.lang] || obj.es || obj.en || '';
  }

  function buildVideoCard(v) {
    const a = document.createElement('a');
    a.className = 'video-card';
    a.href = v.viewer_url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    const title = pickLang(v.title) || 'Video';
    const dur = pickLang(v.duration_label) || '';
    const badge = (v.language || 'es').toUpperCase();
    a.innerHTML =
      '<div class="video-thumb-wrap">' +
        `<img class="video-thumb" src="${v.preview_url}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"/>` +
        `<span class="video-play">${PLAY_SVG}</span>` +
      '</div>' +
      '<div class="video-meta">' +
        `<div class="video-title">${escapeHtml(title)}</div>` +
        `<div class="video-sub"><span class="video-badge">${escapeHtml(badge)}</span>${escapeHtml(dur)}</div>` +
      '</div>';
    return a;
  }

  async function enrichVideosFor(bubble, row) {
    await loadVideos();
    if (!VIDEO_MAP) return;
    const seen = new Set();
    const cards = [];
    bubble.querySelectorAll('a[href*="drive.google.com/file/d/"]').forEach((a) => {
      const m = (a.getAttribute('href') || '').match(/\/file\/d\/([A-Za-z0-9_-]+)/);
      if (!m) return;
      const v = VIDEO_MAP[m[1]];
      if (!v || seen.has(m[1])) return;
      seen.add(m[1]);
      cards.push(buildVideoCard(v));
    });
    if (!cards.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'video-cards';
    cards.forEach((c) => wrap.appendChild(c));
    row.after(wrap);
    scrollToBottom();
  }

  /* ---------- view switching ---------- */
  function ensureChatView() {
    const chat = qs('#view-chat');
    if (chat.classList.contains('active')) return;
    qs('#view-welcome').classList.remove('active');
    chat.classList.add('active');
    autosize(qs('#chat-input'));
    maybeShowMicHint();
    setTimeout(() => qs('#chat-input').focus(), 80);
  }

  function newChat() {
    state.messages = [];
    bodyEl().innerHTML = '';
    clearFollowups();
    qs('#view-chat').classList.remove('active');
    qs('#view-welcome').classList.add('active');
  }

  /* ---------- input ---------- */
  function autosize(el) {
    if (el.offsetParent === null) return; // hidden — sizing would be wrong
    el.style.height = 'auto';
    const h = Math.min(el.scrollHeight, 140);
    el.style.height = h + 'px';
    el.style.overflowY = el.scrollHeight > 140 ? 'auto' : 'hidden';
  }
  function setInputEnabled(on) {
    qs('#chat-input').disabled = !on;
    refreshSendBtn();
  }
  function refreshSendBtn() {
    const inp = qs('#chat-input');
    qs('#btn-send').disabled = state.busy || !inp.value.trim();
  }

  /* ---------- errors ---------- */
  function friendlyError(code) {
    const t = I18N[state.lang];
    if (code === 'server_not_configured') return t.err_notready;
    return t.err;
  }

  /* ---------- send / stream ---------- */
  async function sendMessage(text) {
    text = (text || '').trim();
    if (!text || state.busy) return;
    ensureChatView();
    state.busy = true;
    setInputEnabled(false);
    clearFollowups();

    state.messages.push({ role: 'user', content: text });
    addUserMsg(text);
    const inp = qs('#chat-input');
    inp.value = ''; autosize(inp);

    const { row, bubble } = addGallitoRow();
    let full = '';

    try {
      const res = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: state.messages, language_hint: state.lang })
      });

      if (!res.ok || !res.body) {
        let msg = I18N[state.lang].err;
        try { const j = await res.json(); if (j && j.error) msg = friendlyError(j.error); } catch (e) {}
        throw new Error(msg);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let firstChunk = true;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          const block = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const lines = block.split('\n').filter((l) => l.startsWith('data:'));
          for (const l of lines) {
            const payload = l.slice(l.indexOf(':') + 1).trim();
            if (!payload || payload === '[DONE]') continue;
            try {
              const ev = JSON.parse(payload);
              if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') {
                if (firstChunk) { bubble.innerHTML = ''; firstChunk = false; }
                full += ev.delta.text;
                bubble.innerHTML = renderMarkdown(liveBody(full));
                scrollToBottom();
              }
            } catch (e) { /* ignore keep-alives / non-JSON */ }
          }
        }
      }

      const { body, suggestions } = splitSuggestions(full);
      if (!full.trim()) throw new Error(I18N[state.lang].err);
      bubble.innerHTML = renderMarkdown(body);
      row.classList.remove('streaming');
      state.messages.push({ role: 'assistant', content: body });
      await enrichVideosFor(bubble, row);
      renderFollowups(suggestions);
    } catch (err) {
      row.classList.remove('streaming');
      bubble.classList.add('error');
      const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
      bubble.textContent = offline ? I18N[state.lang].err_offline : (err && err.message ? err.message : I18N[state.lang].err);
      // roll back the user turn so retry doesn't duplicate context with no answer
      if (state.messages.length && state.messages[state.messages.length - 1].role === 'user') {
        state.messages.pop();
      }
    } finally {
      state.busy = false;
      setInputEnabled(true);
      scrollToBottom();
      qs('#chat-input').focus();
    }
  }

  /* ---------- voice input ---------- */
  let recog = null, recognizing = false;
  function speechSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
  function setMicState(on) {
    recognizing = on;
    qs('#btn-mic').classList.toggle('recording', on);
  }
  function makeRecognition(lang) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = lang; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    r.onresult = (e) => {
      let txt = '';
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      const inp = qs('#chat-input');
      inp.value = txt; autosize(inp); refreshSendBtn();
    };
    r.onerror = (e) => {
      setMicState(false);
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') openMicHelp();
    };
    r.onend = () => setMicState(false);
    return r;
  }
  async function toggleMic() {
    if (!speechSupported()) { openMicHelp(); return; }
    if (recognizing) { try { recog.stop(); } catch (e) {} return; }
    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
      }
    } catch (e) { openMicHelp(); return; }
    recog = makeRecognition(state.lang === 'en' ? 'en-US' : 'es-PE');
    if (!recog) { openMicHelp(); return; }
    try { recog.start(); setMicState(true); } catch (e) { setMicState(false); }
  }

  function maybeShowMicHint() {
    if (!speechSupported()) return;
    if (localStorage.getItem('emc-explorar-mic-hint') === '1') return;
    const hint = qs('#mic-hint');
    hint.textContent = I18N[state.lang].mic_hint;
    hint.classList.add('show');
    localStorage.setItem('emc-explorar-mic-hint', '1');
    setTimeout(() => hint.classList.remove('show'), 5200);
  }

  /* ---------- mic help modal ---------- */
  function renderMicHelp() {
    const t = I18N[state.lang];
    qs('#mic-help-title').textContent = t.mic_title;
    qs('#mic-help-intro').textContent = t.mic_intro;
    qs('#mic-help-close').textContent = t.mic_close;
    const tabs = qs('#mic-help-tabs');
    tabs.innerHTML = '';
    [['android', t.mic_tabs.android], ['ios', t.mic_tabs.ios]].forEach(([key, label]) => {
      const b = document.createElement('button');
      b.className = 'mic-help-tab' + (key === micHelpTab ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', () => { micHelpTab = key; renderMicHelp(); });
      tabs.appendChild(b);
    });
    const steps = t.mic_steps[micHelpTab] || [];
    qs('#mic-help-steps').innerHTML = '<ol>' + steps.map((s) => `<li>${escapeHtml(s)}</li>`).join('') + '</ol>';
  }
  function openMicHelp() { renderMicHelp(); qs('#mic-help-backdrop').classList.add('open'); }
  function closeMicHelp() { qs('#mic-help-backdrop').classList.remove('open'); }

  /* ---------- i18n ---------- */
  function applyI18n() {
    const t = I18N[state.lang];
    document.documentElement.lang = state.lang;
    document.title = t.doc_title;
    qs('#hero-title').textContent = t.hero_title;
    qs('#hero-sub').textContent = t.hero_sub;
    qs('#chat-input').placeholder = t.placeholder;
    qs('#btn-new').setAttribute('aria-label', t.new_chat);
    qs('#btn-playbook').textContent = t.playbook;
    qs('#welcome-partners').textContent = t.partners;

    const chipsWrap = qs('#entry-chips');
    chipsWrap.innerHTML = '';
    t.chips.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'suggested';
      b.textContent = c;
      b.addEventListener('click', () => sendMessage(c));
      chipsWrap.appendChild(b);
    });

    document.querySelectorAll('.lang-opt').forEach((o) => o.classList.toggle('active', o.dataset.lang === state.lang));
  }

  function setLang(l) {
    state.lang = (l === 'en') ? 'en' : 'es';
    localStorage.setItem('emc-explorar-lang', state.lang);
    applyI18n();
    if (qs('#mic-help-backdrop').classList.contains('open')) renderMicHelp();
    if (recog) { try { recog.lang = state.lang === 'en' ? 'en-US' : 'es-PE'; } catch (e) {} }
  }

  /* ---------- wire up ---------- */
  function init() {
    applyI18n();

    document.querySelectorAll('.lang-opt').forEach((o) => {
      o.addEventListener('click', () => setLang(o.dataset.lang));
    });

    const inp = qs('#chat-input');
    autosize(inp);
    inp.addEventListener('input', () => { autosize(inp); refreshSendBtn(); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(inp.value);
      }
    });

    qs('#btn-send').addEventListener('click', () => sendMessage(inp.value));
    qs('#btn-mic').addEventListener('click', toggleMic);
    qs('#btn-new').addEventListener('click', newChat);
    qs('#mic-help-close').addEventListener('click', closeMicHelp);
    qs('#mic-help-backdrop').addEventListener('click', (e) => {
      if (e.target === qs('#mic-help-backdrop')) closeMicHelp();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMicHelp();
    });

    loadVideos();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
  </script>
</body>
